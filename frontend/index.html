<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <link rel="author" href="/humans.txt" />
    <link rel="search" type="application/opensearchdescription+xml" title="MyTenant" href="/opensearch.xml" />
    <!-- Preload LCP image (first carousel screenshot) + logo -->
    <link rel="preload" as="image" type="image/webp" href="/ScreenShots/1.PropertyPage.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo-96.png" fetchpriority="high" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Preconnect to API backend (DNS + TCP + TLS done early) -->
    <link rel="preconnect" href="https://tenant-app-4iwfx.ondigitalocean.app" crossorigin />
    <link rel="dns-prefetch" href="https://tenant-app-4iwfx.ondigitalocean.app" />

    <!-- Self-hosted Outfit font — eliminates Google Fonts external requests -->

    <!-- Preload the latin font file for instant text rendering -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin.woff2" crossorigin />

    <!-- Elite Global Schema: Organization & Sitelinks Search Box -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://mytenant.me/#organization",
            "name": "MyTenant",
            "url": "https://mytenant.me",
            "logo": "https://mytenant.me/logo-96.png",
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "support@mytenant.me",
              "contactType": "customer support"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://mytenant.me/#website",
            "url": "https://mytenant.me",
            "name": "MyTenant",
            "publisher": {
              "@id": "https://mytenant.me/#organization"
            },
            "speakable": {
              "@type": "SpeakableSpecification",
              "cssSelector": [".speakable-summary", "#bluf-summary"]
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://mytenant.me/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    
    <!-- Speculation Rules API: Zero-Millisecond Prerendering -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "document",
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/dashboard/*" } },
                { "not": { "href_matches": "/login" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React loading skeleton — replaced when app mounts -->
      <div id="app-loader" style="min-height:100vh;display:flex;background:#0f172a;">
        <style>
          @keyframes ld-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
          .ld-pulse{position:relative;overflow:hidden;border-radius:8px;background:#1e293b}
          .ld-pulse::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:ld-shimmer 1.5s infinite}
        </style>
        <!-- Left branding skeleton with real text for instant FCP -->
        <div style="width:40%;padding:48px;display:flex;flex-direction:column;justify-content:space-between" class="ld-hide-mobile">
          <div style="width:64px;height:64px;border-radius:50%;overflow:hidden"><img src="/logo-96.png" alt="MyTenant Logo" fetchpriority="high" width="64" height="64" style="width:100%;height:100%;object-fit:cover" /></div>
          <div>
            <h1 style="font-size:2.8rem;font-weight:700;color:#fff;line-height:1.2;margin:0 0 16px">Manage your<br><span style="color:#3b82f6">properties</span> with<br>absolute ease.</h1>
            <p id="bluf-summary" class="speakable-summary" style="font-size:1.1rem;color:#94a3b8;margin:0 0 32px;max-width:28rem">MyTenant is the ultimate property management software. It reduces onboarding time by 90% and cuts overhead costs by up to 41%. Track tenants, payments, and maintenance in one professional portal without complex setup.</p>
            <div style="display:flex;gap:12px">
              <div class="ld-pulse" style="height:48px;width:140px;border-radius:12px"></div>
              <div class="ld-pulse" style="height:48px;width:160px;border-radius:12px"></div>
            </div>
          </div>
          <div style="font-size:0.875rem;color:#64748b">© 2026 MyTenant Platform</div>
        </div>
        <!-- Right carousel skeleton -->
        <div style="flex:1;background:#f8fafc;padding:32px;display:flex;flex-direction:column;gap:16px">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="ld-pulse" style="width:36px;height:36px;border-radius:12px;background:#e2e8f0"></div>
            <div class="ld-pulse" style="height:20px;width:100px;background:#e2e8f0"></div>
          </div>
          <div class="ld-pulse" style="flex:1;border-radius:16px;background:#e2e8f0"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;gap:6px">
              <div class="ld-pulse" style="width:32px;height:8px;border-radius:4px;background:#cbd5e1"></div>
              <div class="ld-pulse" style="width:8px;height:8px;border-radius:4px;background:#cbd5e1"></div>
              <div class="ld-pulse" style="width:8px;height:8px;border-radius:4px;background:#cbd5e1"></div>
            </div>
            <div style="display:flex;gap:8px">
              <div class="ld-pulse" style="width:40px;height:40px;border-radius:12px;background:#e2e8f0"></div>
              <div class="ld-pulse" style="width:40px;height:40px;border-radius:12px;background:#e2e8f0"></div>
            </div>
          </div>
        </div>
      </div>
      <style>@media(max-width:1023px){.ld-hide-mobile{display:none!important}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
