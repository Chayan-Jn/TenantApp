<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTenant - Property & Tenant Management Platform</title>
    <meta name="description" content="MyTenant is a modern real estate property and tenant management platform offering automated rent ledgers, bill management, document storage, and easy PDF reporting." />
    <meta name="keywords" content="Property Management, Tenant Management, Rent Ledger, Real Estate, Bill Management, Rental Software, Apartment Management" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mytenant.me/" />
    <meta property="og:title" content="MyTenant - Property & Tenant Management Platform" />
    <meta property="og:description" content="MyTenant is a modern real estate property and tenant management platform offering automated rent ledgers, bill management, document storage, and easy PDF reporting." />
    <meta property="og:image" content="https://mytenant.me/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mytenant.me/" />
    <meta property="twitter:title" content="MyTenant - Property & Tenant Management Platform" />
    <meta property="twitter:description" content="MyTenant is a modern real estate property and tenant management platform offering automated rent ledgers, bill management, document storage, and easy PDF reporting." />
    <meta property="twitter:image" content="https://mytenant.me/logo.png" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font load -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" /></noscript>
    <style>
      body { font-family: 'Outfit', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React loading skeleton — replaced when app mounts -->
      <div id="app-loader" style="min-height:100vh;display:flex;background:#0f172a;">
        <style>
          @keyframes ld-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
          .ld-pulse{position:relative;overflow:hidden;border-radius:8px;background:#1e293b}
          .ld-pulse::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:ld-shimmer 1.5s infinite}
        </style>
        <!-- Left branding skeleton with real text for instant FCP -->
        <div style="width:40%;padding:48px;display:flex;flex-direction:column;justify-content:space-between" class="ld-hide-mobile">
          <div style="width:64px;height:64px;border-radius:50%;overflow:hidden"><img src="/logo-96.png" alt="MyTenant" width="64" height="64" style="width:100%;height:100%;object-fit:cover" /></div>
          <div>
            <h1 style="font-size:2.8rem;font-weight:700;color:#fff;line-height:1.2;margin:0 0 16px">Manage your<br><span style="color:#3b82f6">properties</span> with<br>absolute ease.</h1>
            <p style="font-size:1.1rem;color:#94a3b8;margin:0 0 32px;max-width:28rem">Everything you need to track tenants, payments, and maintenance in one professional portal.</p>
            <div style="display:flex;gap:12px">
              <div class="ld-pulse" style="height:48px;width:140px;border-radius:12px"></div>
              <div class="ld-pulse" style="height:48px;width:160px;border-radius:12px"></div>
            </div>
          </div>
          <div style="font-size:0.875rem;color:#64748b">© 2026 MyTenant Platform</div>
        </div>
        <!-- Right carousel skeleton -->
        <div style="flex:1;background:#f8fafc;padding:32px;display:flex;flex-direction:column;gap:16px">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="ld-pulse" style="width:36px;height:36px;border-radius:12px;background:#e2e8f0"></div>
            <div class="ld-pulse" style="height:20px;width:100px;background:#e2e8f0"></div>
          </div>
          <div class="ld-pulse" style="flex:1;border-radius:16px;background:#e2e8f0"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;gap:6px">
              <div class="ld-pulse" style="width:32px;height:8px;border-radius:4px;background:#cbd5e1"></div>
              <div class="ld-pulse" style="width:8px;height:8px;border-radius:4px;background:#cbd5e1"></div>
              <div class="ld-pulse" style="width:8px;height:8px;border-radius:4px;background:#cbd5e1"></div>
            </div>
            <div style="display:flex;gap:8px">
              <div class="ld-pulse" style="width:40px;height:40px;border-radius:12px;background:#e2e8f0"></div>
              <div class="ld-pulse" style="width:40px;height:40px;border-radius:12px;background:#e2e8f0"></div>
            </div>
          </div>
        </div>
      </div>
      <style>@media(max-width:1023px){.ld-hide-mobile{display:none!important}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
